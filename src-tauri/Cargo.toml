[package]
name = "switcheq"
version = "0.1.0"
description = "Headphone equalizer for Windows: AutoEq corrections through Equalizer APO, Bluetooth status and automatic presets"
edition = "2021"
rust-version = "1.80"

[lib]
name = "switcheq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Data_Xml_Dom",
  "Media",
  "Media_Control",
  "UI_Notifications",
] }
windows-core = "0.62"
windows-collections = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
